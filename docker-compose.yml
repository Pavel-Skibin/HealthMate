version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthmate-postgres
    environment:
      POSTGRES_DB: HealthMate_DB
      POSTGRES_USER: healthmate_user
      POSTGRES_PASSWORD: healthmate_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthmate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmate_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: healthmate-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthmate-network
    environment:
      QDRANT_API_KEY: ""

volumes:
  postgres_data:
  qdrant_data:

networks:
  healthmate-network:
    driver: bridge
